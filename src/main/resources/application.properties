spring.application.name=ASM_WEB_UTE
# Nạp cấu hình cục bộ khi chạy từ thư mục dự án; biến môi trường vẫn được ưu tiên.
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:14090}
# Railway/hosting có thể đặt LAZY_INIT=true để khởi động nhanh hơn
spring.main.lazy-initialization=${LAZY_INIT:false}

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed
spring.mvc.view.prefix=/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/**

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tranvandu19971029@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Database Configuration
# Máy cá nhân dùng mặc định localhost; khi triển khai đặt DB_HOST, DB_PORT, DB_NAME trong biến môi trường
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:asm_web_ute}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Hosting đã import sẵn database/asm_web_ute_data.sql nên có thể đặt DDL_AUTO=none
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.connections.pooling=WARN
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true
# Hiệu năng: gom việc nạp các quan hệ (@ManyToOne, @OneToMany...) thành câu "... WHERE id IN (...)"
# thay vì mỗi bản ghi một câu SELECT (tránh lỗi N+1 truy vấn khi CSDL đặt ở máy chủ xa)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Hiệu năng: nén gzip HTML/CSS/JS và cho trình duyệt lưu đệm tệp tĩnh 1 ngày
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json
server.compression.min-response-size=2048
spring.web.resources.cache.cachecontrol.max-age=1d

# Trang báo lỗi riêng (views/error.jsp) thay cho trang Whitelabel mặc định
spring.web.error.whitelabel.enabled=false

# Custom Application Properties
app.auth.token-ttl-hours=8
app.seed.enabled=true
app.seed.every-run=false
app.demo.quick-login=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
